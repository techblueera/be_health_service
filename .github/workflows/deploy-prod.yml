name: deploy-prod

on:
  push:
    branches: [prod-staging]
  workflow_dispatch: {}           # "Run workflow" button for manual redeploys

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, blueera-prod]
    timeout-minutes: 30
    steps:
      - name: Build, deploy, health-check (auto-rollback on failure)
        run: sudo /opt/blueera/bin/deploy.sh "${{ github.event.repository.name }}" "${{ github.sha }}"
